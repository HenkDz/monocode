<!doctype html>
<html lang="en" class="boot-opaque">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/monocode.png" />
    <title>MonoCode</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var hue = localStorage.getItem("monocode.themeHue");
          var sat = localStorage.getItem("monocode.themeSaturation");
          var darkLightness = localStorage.getItem(
            "monocode.themeDarkLightness",
          );
          var opacity = localStorage.getItem("monocode.sidebarOpacity");
          if (hue != null) {
            var h = Math.max(0, Math.min(360, Number(hue) || 0));
            root.style.setProperty("--theme-hue", String(h));
          }
          if (sat != null) {
            var s = Math.max(0, Math.min(100, Number(sat) || 0));
            root.style.setProperty("--theme-saturation", s + "%");
          }
          if (darkLightness != null) {
            var l = Math.max(0, Math.min(30, Number(darkLightness) || 0));
            root.style.setProperty("--theme-dark-lightness", l + "%");
          }
          if (opacity != null) {
            var o = Math.max(0.15, Math.min(1, Number(opacity) || 0.85));
            root.style.setProperty("--sidebar-opacity", String(o));
          }
          var scheme = localStorage.getItem("monocode.colorScheme");
          if (scheme === "system") {
            scheme = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (scheme === "light") {
            root.classList.add("theme-light");
          }
          var bodyGlass = localStorage.getItem("monocode.bodyGlass");
          if (bodyGlass == null || bodyGlass === "1" || bodyGlass === "true") {
            root.classList.add("glass-body");
          }
          var isMac =
            typeof navigator !== "undefined" &&
            /Mac|iPhone|iPad/.test(navigator.platform);
          if (isMac) {
            root.classList.add("is-mac");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        --theme-hue: 240;
        --theme-saturation: 0%;
        --theme-dark-lightness: 9%;
        --sidebar-opacity: 0.85;
        --background-lightness: var(--theme-dark-lightness);
        --color-background-base: hsl(
          var(--theme-hue) var(--theme-saturation) var(--background-lightness)
        );
      }

      html.theme-light {
        --background-lightness: 97%;
      }

      html,
      body,
      #boot-splash {
        margin: 0;
        background: var(--color-background-base);
      }

      /* Opaque cover until React paints. The logo is in HTML so it is
         visible during the Dock bounce, before the bundle runs. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition: opacity 0.16s ease;
        flex-direction: column;
        gap: 20px;
        color: #eee;
        font:
          14px/1.5 system-ui,
          sans-serif;
        text-align: center;
        padding: 32px;
      }

      html.boot-opaque,
      .boot-opaque body,
      .boot-opaque #root {
        background: var(--color-background-base) !important;
      }

      .theme-light #boot-splash {
        color: #222;
      }
      #boot-splash [hidden] {
        display: none;
      }
      #boot-splash p {
        max-width: 440px;
        margin: 0;
      }
      #boot-splash button {
        font: inherit;
        color: inherit;
        background: var(--color-background-base);
        border: 1px solid currentColor;
        border-radius: 6px;
        padding: 8px 16px;
        cursor: pointer;
      }
      #boot-splash button:focus-visible {
        outline: 2px solid #389bff;
        outline-offset: 4px;
      }
      #boot-splash [data-boot-controls] {
        position: absolute;
        top: 0;
        right: 0;
        height: 40px;
      }
      #boot-splash [data-boot-controls] button {
        border: 0;
        border-radius: 0;
        padding: 0;
      }
      #boot-splash[data-state="error"],
      #boot-splash[data-state="timeout"] {
        opacity: 1;
        pointer-events: auto;
        transition: none;
      }
      .boot-paint-marker {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font:
          12px system-ui,
          sans-serif;
        color: #888;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }
      }

      #boot-splash.boot-splash-out {
        opacity: 0;
      }

      #boot-splash img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" data-state="loading" aria-hidden="true">
      <div data-boot-controls></div>
      <img src="/monocode.png" alt="" />
      <p data-boot-message role="alert"></p>
      <button data-boot-retry type="button" hidden>Retry</button>
      <button data-boot-continue type="button" hidden>
        Continue without transparency
      </button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
